name: CI

on:
  push:
    branches: [master]
    paths:
      - "Week-6/marketplace/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Week-6/marketplace/**"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Week-6/marketplace/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Week-6/marketplace/backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Week-6/marketplace/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Week-6/marketplace/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: /api
