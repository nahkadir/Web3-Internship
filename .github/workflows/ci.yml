name: CI/CD

on:
  push:
    branches: [master]
    paths:
      - "Week-6/marketplace/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Week-6/marketplace/**"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Week-6/marketplace/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Week-6/marketplace/backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Week-6/marketplace/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Week-6/marketplace/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: /api

  docker-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t marketplace-backend Week-6/marketplace/backend
      - run: docker build -t marketplace-frontend Week-6/marketplace/frontend

  deploy-backend:
    needs: [backend-tests, frontend-build, docker-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    env:
      HEALTH_URL: https://marketplace-api-ozw3.onrender.com/api/health
    steps:
      - name: Trigger the Render deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Wait until the new version is live
        run: |
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS --max-time 60 "$HEALTH_URL" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4 || true)
            echo "attempt $i: live commit = '$LIVE', expected = '${GITHUB_SHA::7}'"
            [ "$LIVE" = "${GITHUB_SHA::7}" ] && echo "Deployed." && exit 0
            sleep 20
          done
          echo "The new version did not go live in time"
          exit 1
