services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mongodb://mongo:27017/marketplace
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file next to this one}
      FRONTEND_URL: http://localhost:8080
      BACKEND_URL: http://localhost:5000
      PAYMENT_PROVIDER: mock
      ALLOW_MOCK_PAYMENTS: "true"
      PAYMENT_PUBLIC_KEY: pk_test
      PAYMENT_SECRET_KEY: sk_test
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET in the .env file next to this one}
      PAYMENT_CURRENCY: PKR
      COMMISSION_RATE: "0.10"
      PAYMENT_WINDOW_MINUTES: "30"
      TRUST_PROXY_HOPS: "1"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
